services:
  - type: web
    name: nexora-backend
    env: python
    buildCommand: "./render-build.sh"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    rootDir: backend
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: nexora-db
          property: connectionString
      - key: GROQ_API_KEY
        sync: false

  - type: web
    name: nexora-frontend
    env: static
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    rootDir: frontend
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: nexora-db
    databaseName: nexora_db
    user: nexora_user
    plan: free
