name: Nexora pipeline cron

on:
  schedule:
    # Twice a week: Monday and Thursday (UTC). Deadlines are usually weeks
    # away, and the website hides passed deadlines at read time, so more
    # frequent runs add load without adding freshness.
    - cron: "17 0 * * 1,4"  # ingest (Mon + Thu 00:17)
    - cron: "43 1 * * 1,4"  # lifecycle sweep (Mon + Thu 01:43, after ingest)
    - cron: "7 3 * * 0"     # weekly publishing refresh (Sun 03:07)
  workflow_dispatch:
    inputs:
      job:
        description: Pipeline job to run now
        type: choice
        options: [ingest, lifecycle, publish]
        default: ingest

# Calls the authenticated cron endpoint with a bounded cold-start retry: a
# sleeping Render instance may take ~60s to wake, so connection failures and
# HTML splash pages are retried. An application failure (HTTP 500 with
# "success": false) fails the run immediately — it is not a cold start.
# All jobs are idempotent and the API skips a job that is already running.
jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Pick pipeline job
        id: pick
        env:
          SCHEDULE: ${{ github.event.schedule }}
          DISPATCH_JOB: ${{ inputs.job }}
        run: |
          case "$SCHEDULE" in
            "43 1 * * 1,4") job=lifecycle ;;
            "7 3 * * 0")  job=publish ;;
            "")           job="${DISPATCH_JOB:-ingest}" ;;
            *)            job=ingest ;;
          esac
          echo "job=$job" >> "$GITHUB_OUTPUT"

      - name: Trigger ${{ steps.pick.outputs.job }}
        env:
          JOB: ${{ steps.pick.outputs.job }}
          API_URL: ${{ secrets.NEXORA_API_URL }}
          ADMIN_KEY: ${{ secrets.NEXORA_ADMIN_SECRET_KEY }}
        run: |
          if [ -z "$API_URL" ] || [ -z "$ADMIN_KEY" ]; then
            echo "::error::Repository secrets NEXORA_API_URL and NEXORA_ADMIN_SECRET_KEY must be set" >&2
            exit 1
          fi
          for attempt in 1 2 3; do
            body=$(curl --fail-with-body --silent --show-error --max-time 900 --request POST \
              --header "X-Admin-Key: $ADMIN_KEY" \
              "$API_URL/api/pipeline/cron/$JOB") || true
            if echo "$body" | grep -q '"success"[[:space:]]*:[[:space:]]*true'; then
              echo "$JOB OK: $body"
              exit 0
            fi
            if echo "$body" | grep -q '"success"[[:space:]]*:[[:space:]]*false'; then
              echo "::error::$JOB failed in the application: $body" >&2
              exit 1
            fi
            echo "Attempt $attempt did not reach a healthy API (cold start or network error)"
            if [ "$attempt" -lt 3 ]; then sleep 30; fi
          done
          echo "::error::$JOB endpoint did not return a valid response after 3 attempts" >&2
          exit 1
