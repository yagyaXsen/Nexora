<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexora Smart Reminders Demo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
        }
        .card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        .header {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
        }
        .dist-row {
            padding: 0.75rem 0;
            border-bottom: 1px solid #e2e8f0;
        }
        .dist-row:last-child {
            border-bottom: none;
        }
        .dist-label-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
        }
        .dist-track {
            height: 0.5rem;
            background-color: #e2e8f0;
            border-radius: 0.25rem;
            overflow: hidden;
        }
        .dist-bar {
            height: 100%;
            background-color: #22c55e;
        }
        .dist-bar.critical {
            background-color: #ef4444;
        }
        .dist-bar.warning {
            background-color: #f97316;
        }
        .dist-bar.attention {
            background-color: #22c55e;
        }
    </style>
</head>
<body>
    <div class="max-w-6xl mx-auto p-6">
        <div class="card p-6">
            <div class="header">Smart Reminders Dashboard</div>

            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem;">
                <div class="card p-4">
                    <div style="font-size: 1.125rem; font-weight: 600; margin-bottom: 1rem; color: #3b82f6;">
                        Upcoming Deadlines
                    </div>

                    <div>
                        <div class="dist-row">
                            <div class="dist-label-row">
                                <span>Google Research Fellowship</span>
                                <strong>5 days left</strong>
                            </div>
                            <div class="dist-track">
                                <div class="dist-bar critical" style="width: 83%"></div>
                            </div>
                        </div>

                        <div class="dist-row">
                            <div class="dist-label-row">
                                <span>Scholarship Program</span>
                                <strong>12 days left</strong>
                            </div>
                            <div class="dist-track">
                                <div class="dist-bar warning" style="width: 60%"></div>
                            </div>
                        </div>

                        <div class="dist-row">
                            <div class="dist-label-row">
                                <span>Startup Accelerator</span>
                                <strong>20 days left</strong>
                            </div>
                            <div class="dist-track">
                                <div class="dist-bar attention" style="width: 33%"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card p-4">
                    <div style="font-size: 1.125rem; font-weight: 600; margin-bottom: 1rem; color: #3b82f6;">
                        Reminder Settings
                    </div>

                    <div style="margin-bottom: 1rem; padding: 1rem; background: #fffbeb; border: 1px solid #fbbf24; border-radius: 0.375rem;">
                        <div style="display: flex; align-items: center; gap: 0.5rem;">
                            <span>⚠️</span>
                            <div>
                                <div style="font-weight: 500;">Important Deadlines</div>
                                <div style="font-size: 0.875rem; color: #64748b;">These are your most urgent deadlines</div>
                            </div>
                        </div>
                    </div>

                    <div style="padding: 1rem; background: white; border: 1px solid #cbd5e1; border-radius: 0.375rem;">
                        <div style="font-weight: 500; margin-bottom: 0.5rem;">Reminder Preferences</div>
                        <div style="display: flex; flex-direction: column; gap: 0.5rem;">
                            <div style="display: flex; align-items: center;">
                                <input type="checkbox" id="email" style="margin-right: 0.5rem;" checked>
                                <label for="email">Email Notifications</label>
                            </div>
                            <div style="display: flex; align-items: center;">
                                <input type="checkbox" id="push" style="margin-right: 0.5rem;">
                                <label for="push">Push Notifications</label>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
