<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexora Smart Reminders</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lucide-static@latest/font/lucide.css">
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="max-w-4xl mx-auto p-6">
        <div class="bg-white rounded-xl shadow-lg p-6">
            <div class="flex items-center gap-3 mb-6">
                <i data-lucide="calendar" class="text-blue-600"></i>
                <h1 class="text-2xl font-bold">Smart Reminders</h1>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="bg-gradient-to-br from-blue-50 to-indigo-50 rounded-lg p-4 border border-blue-200">
                    <h2 class="text-lg font-semibold mb-3 text-blue-800">Upcoming Deadlines</h2>
                    <div class="space-y-3">
                        <div class="p-4 rounded-lg border-l-4 border-blue-200 pl-4 py-2 bg-white hover:border-blue-300 transition-colors">
                            <div>
                                <div class="flex justify-between items-start">
                                    <div>
                                        <h3 class="font-semibold">Google Research Fellowship</h3>
                                        <p class="text-sm text-gray-600">Google Inc.</p>
                                    </div>
                                    <div class="text-right">
                                        <span class="px-2 py-1 rounded text-sm font-medium bg-red-500 text-white">
                                            5 days left
                                        </span>
                                    </div>
                                </div>
                                <div class="mt-2">
                                    <div class="w-full bg-gray-200 rounded-full h-2">
                                        <div
                                            class="h-2 rounded-full bg-red-500"
                                            style="width: 83%">
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="p-4 rounded-lg border-l-4 border-yellow-200 pl-4 py-2 bg-white hover:border-yellow-300 transition-colors">
                            <div>
                                <div class="flex justify-between items-start">
                                    <div>
                                        <h3 class="font-semibold">Scholarship Program</h3>
                                        <p class="text-sm text-gray-600">University Grants</p>
                                    </div>
                                    <div class="text-right">
                                        <span class="px-2 py-1 rounded text-sm font-medium bg-yellow-500 text-white">
                                            12 days left
                                        </span>
                                    </div>
                                </div>
                                <div class="mt-2">
                                    <div class="w-full bg-gray-200 rounded-full h-2">
                                        <div
                                            class="h-2 rounded-full bg-yellow-500"
                                            style="width: 60%">
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="p-4 rounded-lg border-l-4 border-green-200 pl-4 py-2 bg-white hover:border-green-300 transition-colors">
                            <div>
                                <div class="flex justify-between items-start">
                                    <div>
                                        <h3 class="font-semibold">Startup Accelerator</h3>
                                        <p class="text-sm text-gray-600">TechHub</p>
                                    </div>
                                    <div class="text-right">
                                        <span class="px-2 py-1 rounded text-sm font-medium bg-green-500 text-white">
                                            20 days left
                                        </span>
                                    </div>
                                </div>
                                <div class="mt-2">
                                    <div class="w-full bg-gray-200 rounded-full h-2">
                                        <div
                                            class="h-2 rounded-full bg-green-500"
                                            style="width: 33%">
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Initialize Lucide icons
        lucide.createIcons();
    </script>
</body>
</html>
